name: Profile assets

on:
  schedule:
    - cron: "15 22 * * *"   # daily, 06:15 Ulaanbaatar time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/*.json"
      - "assets/source/**"
      - "scripts/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/banner/requirements.txt

      # Hand-authored charts (edit the JSON files to change them)
      - name: Skill radar
        run: python scripts/radar.py --data assets/skills.json -o assets/radar
      - name: Language radar
        run: python scripts/radar.py --data assets/langmix.json -o assets/radar-langs --values
      - name: Journey timeline
        run: python scripts/timeline.py --data assets/journey.json -o assets/journey

      # Live cards. METRICS_TOKEN (optional PAT) unlocks contribution + streak tiles;
      # the built-in GITHUB_TOKEN is the fallback.
      - name: Project, stats and language cards
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/cards.py --user "${{ github.repository_owner }}" --out assets

      # Animated banner (deterministic, so an unchanged input produces no diff)
      - name: Banner
        run: |
          pip install -r scripts/banner/requirements.txt
          python scripts/banner/generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: refresh profile assets"
          git push

name: Profile banner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/source/**"
      - "scripts/banner/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile-banner
  cancel-in-progress: true

jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/banner/requirements.txt

      # Animated banner (deterministic, so an unchanged input produces no diff)
      - name: Banner
        run: |
          pip install -r scripts/banner/requirements.txt
          python scripts/banner/generate.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --staged --quiet || git commit -m "chore: refresh banner"
          git push

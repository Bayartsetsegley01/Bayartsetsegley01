<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 190" width="430" height="190" role="img" aria-label="NEYRA project card" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><linearGradient id="gneyradark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B69CFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient><clipPath id="kneyradark"><rect width="430" height="190" rx="12"/></clipPath></defs><rect x="0.5" y="0.5" width="429" height="189" rx="12" fill="#0F1024" stroke="#2A2C4F"/><rect width="430" height="3" fill="url(#gneyradark)" clip-path="url(#kneyradark)"/><text x="20" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.1" fill="#67E8F9">MOBILE · AI</text><rect x="313" y="23" width="97" height="19" rx="9.5" fill="#FBBF24" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".45"/><circle cx="324" cy="32.5" r="3.2" fill="#FBBF24"></circle><text x="333" y="36.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#FBBF24">IN PROGRESS</text><text x="20" y="66" font-size="19" font-weight="700" fill="#E4E6FA">NEYRA</text><text x="20" y="86" font-size="12" font-weight="600" fill="#B69CFF">AI vision board -&gt; daily action plan</text><text x="20" y="108" font-size="11.5" fill="#C3C5E0">Turns a vision board and goals into AI-generated steps, then tracks</text><text x="20" y="124" font-size="11.5" fill="#C3C5E0">daily progress with photos. Auth, database, image storage and AI</text><text x="20" y="140" font-size="11.5" fill="#C3C5E0">features wired into one system.</text><rect x="20" y="152" width="91" height="20" rx="6" fill="#1B1D3A"/><text x="65.4" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#C9BBFF">React Native</text><rect x="117" y="152" width="40" height="20" rx="6" fill="#1B1D3A"/><text x="136.7" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#C9BBFF">Expo</text><rect x="162" y="152" width="65" height="20" rx="6" fill="#1B1D3A"/><text x="195.1" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#C9BBFF">Supabase</text><rect x="234" y="152" width="52" height="20" rx="6" fill="#1B1D3A"/><text x="259.9" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#C9BBFF">AI API</text><path transform="translate(396,155)" d="M2 12 12 2M4.5 2H12v7.5" fill="none" stroke="#B69CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 190" width="430" height="190" role="img" aria-label="LendFlow Lite project card" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif"><defs><linearGradient id="glendflow-litelight" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5B3FD1"/><stop offset="1" stop-color="#0E7490"/></linearGradient><clipPath id="klendflow-litelight"><rect width="430" height="190" rx="12"/></clipPath></defs><rect x="0.5" y="0.5" width="429" height="189" rx="12" fill="#FFFFFF" stroke="#D6D2EA"/><rect width="430" height="3" fill="url(#glendflow-litelight)" clip-path="url(#klendflow-litelight)"/><text x="20" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" letter-spacing="1.1" fill="#0E7490">LENDING · FULL-STACK</text><rect x="313" y="23" width="97" height="19" rx="9.5" fill="#0E7490" fill-opacity=".12" stroke="#0E7490" stroke-opacity=".45"/><circle cx="324" cy="32.5" r="3.2" fill="#0E7490"></circle><text x="333" y="36.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" font-weight="700" fill="#0E7490">OPEN SOURCE</text><text x="20" y="66" font-size="19" font-weight="700" fill="#1C1A33">LendFlow Lite</text><text x="20" y="86" font-size="12" font-weight="600" fill="#5B3FD1">Loan workflow with credit scoring</text><text x="20" y="108" font-size="11.5" fill="#35324F">Loan applications, rule-based credit scoring, admin review, disbursement</text><text x="20" y="124" font-size="11.5" fill="#35324F">and EMI schedules. @Transactional updates keep account, loan and ledger</text><text x="20" y="140" font-size="11.5" fill="#35324F">atomic. JWT auth, Docker Compose.</text><rect x="20" y="152" width="84" height="20" rx="6" fill="#F1EFFA"/><text x="62.2" y="166" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#4A33B0">Spring Boot</text><rect x="110" y="152" width="33" height="20"